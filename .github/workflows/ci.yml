name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      frontend: ${{ steps.filter.outputs.frontend }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -Eeuo pipefail
          api=false; worker=false; frontend=false
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            api=true; worker=true; frontend=true
          else
            git diff --no-renames --name-only -z "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md|LICENSE|docs/*|tests/*) ;;
                src/Prumo.Api/*) api=true ;;
                src/Prumo.Worker/*) worker=true ;;
                src/Prumo.Application/*|src/Prumo.Domain/*|src/Prumo.Infrastructure/*) api=true; worker=true ;;
                frontend/prumo-web/*) frontend=true ;;
                Dockerfile|.dockerignore|Prumo.sln|Directory.*|global.json) api=true; worker=true ;;
                *) api=true; worker=true; frontend=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          images=false
          if [[ "$api" == true || "$worker" == true || "$frontend" == true ]]; then images=true; fi
          for name in api worker frontend images; do echo "$name=${!name}" >> "$GITHUB_OUTPUT"; done

  validate:
    name: Validation
    runs-on: ubuntu-latest
    outputs:
      test_count: ${{ steps.tests.outputs.test_count }}
      test_duration: ${{ steps.tests.outputs.duration }}
      build_duration: ${{ steps.build.outputs.duration }}
      total_duration: ${{ steps.metrics.outputs.duration }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prumo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prumo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Start validation timer
        id: timer
        shell: bash
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore Prumo.sln

      - name: Build backend
        id: build
        shell: bash
        run: |
          started_at=$(date +%s)
          dotnet build Prumo.sln --no-restore
          duration=$(( $(date +%s) - started_at ))
          echo "duration=${duration}s" >> "$GITHUB_OUTPUT"

      - name: Test backend and relational suite
        id: tests
        shell: bash
        env:
          PRUMO_RUN_RELATIONAL_TESTS: '1'
        run: |
          started_at=$(date +%s)
          set +e
          dotnet test Prumo.sln --no-build \
            --results-directory "$RUNNER_TEMP/prumo-test-results" \
            -- --report-trx --report-trx-filename test-results.trx
          test_exit_code=$?
          set -e

          test_count=0
          while IFS= read -r -d '' result_file; do
            count=$(grep -oPm1 'total="\K[0-9]+' "$result_file" || true)
            test_count=$((test_count + ${count:-0}))
          done < <(find "$RUNNER_TEMP/prumo-test-results" -type f -name '*.trx' -print0 2>/dev/null)

          duration=$(( $(date +%s) - started_at ))
          echo "test_count=$test_count" >> "$GITHUB_OUTPUT"
          echo "duration=${duration}s" >> "$GITHUB_OUTPUT"
          exit "$test_exit_code"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.12.0
          cache: npm
          cache-dependency-path: frontend/prumo-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/prumo-web
        run: npm ci

      - name: Lint frontend
        working-directory: frontend/prumo-web
        run: npm run lint

      - name: Test frontend
        working-directory: frontend/prumo-web
        run: npm test

      - name: Build frontend
        working-directory: frontend/prumo-web
        run: npm run build

      - name: Publish validation metrics
        id: metrics
        if: always()
        shell: bash
        run: |
          duration=$(( $(date +%s) - ${{ steps.timer.outputs.started_at }} ))
          echo "duration=${duration}s" >> "$GITHUB_OUTPUT"

  images:
    name: Build and test images
    needs: [validate, changes]
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: prumo-images-${{ github.event_name == 'push' && 'main' || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build application images
        shell: bash
        run: |
          set -Eeuo pipefail
          source_label="org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          version="$(git tag --merged HEAD | sed 's/^v//' | sort -Vr | awk '/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && !found {print; found=1}')"
          docker build --target api --label "$source_label" -t prumo-api:ci .
          docker build --target worker --label "$source_label" -t prumo-worker:ci .
          docker build --label "$source_label" --build-arg "PRUMO_VERSION=${version:-dev}" -t prumo-frontend:ci ./frontend/prumo-web

      - name: Smoke test application containers
        shell: bash
        env:
          PRUMO_API_IMAGE: prumo-api:ci
          PRUMO_WORKER_IMAGE: prumo-worker:ci
          PRUMO_FRONTEND_IMAGE: prumo-frontend:ci
          AI_API_KEY: ci-smoke-test
        run: |
          set -Eeuo pipefail
          docker compose up -d --no-build

          for attempt in {1..60}; do
            api_id="$(docker compose ps -q api)"
            worker_id="$(docker compose ps -q worker)"
            frontend_id="$(docker compose ps -q frontend)"
            if [[ -n "$api_id" && -n "$worker_id" && -n "$frontend_id" ]] \
              && [[ "$(docker inspect -f '{{.State.Health.Status}}' "$api_id")" == healthy ]] \
              && [[ "$(docker inspect -f '{{.State.Status}}' "$worker_id")" == running ]] \
              && [[ "$(docker inspect -f '{{.State.Status}}' "$frontend_id")" == running ]] \
              && curl --fail --silent http://127.0.0.1:5273/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done

          docker compose ps --all
          docker compose logs --tail=100
          exit 1

      - name: Stop smoke test containers
        if: always()
        shell: bash
        env:
          PRUMO_API_IMAGE: prumo-api:ci
          PRUMO_WORKER_IMAGE: prumo-worker:ci
          PRUMO_FRONTEND_IMAGE: prumo-frontend:ci
        run: docker compose down --volumes --remove-orphans

      # The full smoke test builds all images; only changed images are transferred.
      - name: Save tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          API_CHANGED: ${{ needs.changes.outputs.api }}
          WORKER_CHANGED: ${{ needs.changes.outputs.worker }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
        run: |
          set -Eeuo pipefail
          images=()
          for service in api worker frontend; do
            name="${service^^}_CHANGED"
            if [[ "${!name}" == true ]]; then images+=("prumo-$service:ci"); fi
          done
          docker save "${images[@]}" -o "$RUNNER_TEMP/prumo-images.tar"

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-images
          path: ${{ runner.temp }}/prumo-images.tar
          retention-days: 1

  publish:
    name: Publish tested images
    needs: [changes, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.publish.outputs.api_image }}
      worker_image: ${{ steps.publish.outputs.worker_image }}
      frontend_image: ${{ steps.publish.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tested-images
          path: ${{ runner.temp }}
      - name: Load tested images
        run: docker load -i "$RUNNER_TEMP/prumo-images.tar"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested images
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          API_CHANGED: ${{ needs.changes.outputs.api }}
          WORKER_CHANGED: ${{ needs.changes.outputs.worker }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
        run: |
          set -Eeuo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          services=()
          for service in api worker frontend; do
            name="${service^^}_CHANGED"
            if [[ "${!name}" == true ]]; then services+=("$service"); fi
          done
          for service in "${services[@]}"; do
            tag="$repository-$service:$GITHUB_SHA"
            docker tag "prumo-$service:ci" "$tag"
            docker push "$tag"
            image="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag" | grep -m1 -F "$repository-$service@sha256:")"
            if [[ -z "$image" ]]; then
              echo "Could not resolve pushed image digest for $service"
              exit 1
            fi
            echo "${service}_image=$image" >> "$GITHUB_OUTPUT"
          done
          if [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]]; then
            for service in "${services[@]}"; do
              docker tag "prumo-$service:ci" "$repository-$service:latest"
              docker push "$repository-$service:latest"
            done
          fi

  deploy:
    name: Deploy
    needs: [changes, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.result == 'success'
    permissions:
      packages: read
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    runs-on:
      - self-hosted
      - linux
      - prumo-deploy
    concurrency:
      group: prumo-production-deploy
      cancel-in-progress: false
    env:
      PRUMO_DEPLOY_PATH: ${{ vars.PRUMO_DEPLOY_PATH }}
      API_CHANGED: ${{ needs.changes.outputs.api }}
      WORKER_CHANGED: ${{ needs.changes.outputs.worker }}
      FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
      PRUMO_API_IMAGE: ${{ needs.publish.outputs.api_image }}
      PRUMO_WORKER_IMAGE: ${{ needs.publish.outputs.worker_image }}
      PRUMO_FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend_image }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy approved commit with Docker Compose
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${PRUMO_DEPLOY_PATH:-}" ]]; then
            echo "Repository variable PRUMO_DEPLOY_PATH is not configured."
            exit 1
          fi

          if [[ ! -d "$PRUMO_DEPLOY_PATH/.git" ]]; then
            echo "Deploy checkout not found: $PRUMO_DEPLOY_PATH"
            exit 1
          fi

          git config --global --add safe.directory "$PRUMO_DEPLOY_PATH"
          cd "$PRUMO_DEPLOY_PATH"
          git fetch --prune origin main

          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on main; skipping this deployment."
            exit 0
          fi

          if ! git cat-file -e "${GITHUB_SHA}^{commit}"; then
            echo "Approved commit was not fetched: $GITHUB_SHA"
            exit 1
          fi

          # Track the last deployed checkout separately: a failed deploy may already
          # have reset HEAD. Do not silently omit changes from an earlier run.
          deployed_file="$(git rev-parse --git-path prumo-deployed-sha)"
          if [[ ! -f "$deployed_file" ]]; then git rev-parse HEAD > "$deployed_file"; fi
          deployed_sha="$(cat "$deployed_file")"
          git cat-file -e "${deployed_sha}^{commit}"
          paths_file="$(mktemp)"
          trap 'rm -f "$paths_file"' EXIT
          git diff --no-renames --name-only -z "$deployed_sha" "$GITHUB_SHA" > "$paths_file"
          while IFS= read -r -d '' path; do
            case "$path" in
              README.md|LICENSE|docs/*|tests/*) continue ;;
              src/Prumo.Api/*) required=(api) ;;
              src/Prumo.Worker/*) required=(worker) ;;
              src/Prumo.Application/*|src/Prumo.Domain/*|src/Prumo.Infrastructure/*|Dockerfile|.dockerignore|Prumo.sln|Directory.*|global.json) required=(api worker) ;;
              frontend/prumo-web/*) required=(frontend) ;;
              *) required=(api worker frontend) ;;
            esac
            for service in "${required[@]}"; do
              name="${service^^}_CHANGED"
              if [[ "${!name}" != true ]]; then
                echo "Missing $service image for changes since last deployed commit $deployed_sha; deploy stopped."
                exit 1
              fi
            done
          done < "$paths_file"

          git reset --hard "$GITHUB_SHA"
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Approved SHA: $GITHUB_SHA"
          echo "Checked out SHA: $checked_out_sha"
          [[ "$checked_out_sha" == "$GITHUB_SHA" ]]

          changed_services=()
          for service in api worker frontend; do
            name="${service^^}_CHANGED"
            if [[ "${!name}" == true ]]; then
              image_var="PRUMO_${service^^}_IMAGE"
              [[ -n "${!image_var}" ]] || { echo "Missing image digest for $service"; exit 1; }
              changed_services+=("$service")
            fi
          done
          (( ${#changed_services[@]} > 0 )) || exit 0
          docker compose pull "${changed_services[@]}"
          docker compose up -d --no-build --no-deps "${changed_services[@]}"

          services=(postgres api worker frontend)
          for attempt in {1..60}; do
            all_running=true
            for service in "${services[@]}"; do
              container_id="$(docker compose ps -q "$service")"
              if [[ -z "$container_id" ]]; then
                all_running=false
                continue
              fi

              status="$(docker inspect -f '{{.State.Status}}' "$container_id")"
              if [[ "$status" != "running" ]]; then
                all_running=false
              fi

              health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
              if [[ "$service" == "postgres" || "$service" == "api" ]] && [[ "$health" != "healthy" ]]; then
                all_running=false
              fi
            done

            if [[ "$all_running" == true ]] && curl --fail --silent http://127.0.0.1:5200/health >/dev/null; then
              break
            fi

            if [[ "$attempt" == 60 ]]; then
              echo "Prumo services did not become healthy."
              docker compose ps --all
              exit 1
            fi
            sleep 5
          done

          docker compose ps --all
          printf '%s\n' "$GITHUB_SHA" > "$deployed_file"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Cleanup old Docker artifacts
        if: steps.deploy.outputs.deployed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          docker image prune --all --force
          docker builder prune --all --force

  notify-discord:
    name: Notify Discord
    needs:
      - validate
      - images
      - publish
      - deploy
    if: always()
    runs-on: ubuntu-latest
    env:
      DISCORD_CI_WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}

    steps:
      - name: Report CI and deploy status
        if: env.DISCORD_CI_WEBHOOK_URL != ''
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          ci_status="${{ needs.validate.result }}"
          image_status="${{ needs.images.result }}"
          publish_status="${{ needs.publish.result }}"
          deploy_status="${{ needs.deploy.result }}"
          deployed="${{ needs.deploy.outputs.deployed }}"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          short_sha="${GITHUB_SHA:0:7}"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          payload="$(jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg event "${{ github.event_name }}" \
            --arg branch "${GITHUB_REF_NAME}" \
            --arg sha "${GITHUB_SHA}" \
            --arg short_sha "$short_sha" \
            --arg actor "${GITHUB_ACTOR}" \
            --arg ci_status "$ci_status" \
            --arg image_status "$image_status" \
            --arg publish_status "$publish_status" \
            --arg deploy_status "$deploy_status" \
            --arg deployed "$deployed" \
            --arg run_number "${GITHUB_RUN_NUMBER}" \
            --arg test_count "${{ needs.validate.outputs.test_count || 'n/d' }}" \
            --arg test_duration "${{ needs.validate.outputs.test_duration || 'n/d' }}" \
            --arg build_duration "${{ needs.validate.outputs.build_duration || 'n/d' }}" \
            --arg total_duration "${{ needs.validate.outputs.total_duration || 'n/d' }}" \
            --arg run_url "$run_url" \
            --arg timestamp "$timestamp" \
            '{embeds: [
              (
                if $ci_status == "success" and $image_status == "success" and $deploy_status == "success" and $deployed == "true" then
                  {title: "✅ Prumo — deploy concluído", color: 3066993}
                elif $ci_status != "success" or $image_status == "failure" or $publish_status == "failure" then
                  {title: "❌ Prumo — CI falhou", color: 15158332}
                elif $deploy_status == "failure" then
                  {title: "❌ Prumo — deploy falhou", color: 15158332}
                elif $ci_status == "success" and $image_status == "skipped" then
                  {title: "✅ Prumo — validação concluída, sem imagens alteradas", color: 3066993}
                elif $event == "pull_request" and $image_status == "success" then
                  {title: "✅ Prumo — validação concluída", color: 3066993}
                else
                  {title: "⚠️ Prumo — deploy não executado", color: 16776960}
                end
                + {
                  url: $run_url,
                  description: "Execução automática do GitHub Actions",
                  fields: [
                    {name: "CI / testes", value: $ci_status, inline: true},
                    {name: "Imagens", value: $image_status, inline: true},
                    {name: "Deploy", value: $deploy_status, inline: true},
                    {name: "Testes", value: $test_count, inline: true},
                    {name: "Duração dos testes", value: $test_duration, inline: true},
                    {name: "Duração do build", value: $build_duration, inline: true},
                    {name: "Duração total", value: $total_duration, inline: true},
                    {name: "Branch", value: ("`" + $branch + "`"), inline: true},
                    {name: "Commit", value: ("`" + $short_sha + "`"), inline: true},
                    {name: "Autor", value: ("`" + $actor + "`"), inline: true}
                  ],
                  footer: {text: "Prumo • GitHub Actions"},
                  timestamp: $timestamp
                }
              )
            ]} | .embeds[0].title += " (run #" + $run_number + ")"')"

          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_CI_WEBHOOK_URL"
